<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Montra Praça Digital</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Uma coluna de telemóvel; a lead escolhe-se no topo; cada separador em baixo é um passo da visita. */
:root{
  --bg:#f4f4f7; --card:#ffffff; --ink:#17162b; --mute:#5d5b70; --line:#e3e2ec;
  --accent:#4b33c9; --accent-ink:#ffffff; --gold:#4b33c9; --gold-bg:#efecfd;
  --ok:#1d8a4e; --ok-bg:#e5f5ec; --warn:#9a5200; --warn-bg:#fdf1df;
  --body:Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f0e1a; --card:#1a1930; --ink:#ecebf5; --mute:#a9a7bf; --line:#2c2a48;
  --accent:#a99bff; --accent-ink:#17162b; --gold:#a99bff; --gold-bg:#26234a;
  --ok:#6fd49b; --ok-bg:#183326; --warn:#f0b56a; --warn-bg:#33270f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f0e1a; --card:#1a1930; --ink:#ecebf5; --mute:#a9a7bf; --line:#2c2a48;
  --accent:#a99bff; --accent-ink:#17162b; --gold:#a99bff; --gold-bg:#26234a;
  --ok:#6fd49b; --ok-bg:#183326; --warn:#f0b56a; --warn-bg:#33270f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 110px;display:grid;gap:14px}
header.topo{display:grid;gap:10px;position:sticky;top:0;z-index:4;background:var(--bg);padding-block:6px}
.linha{display:flex;align-items:center;justify-content:space-between;gap:10px}
.marca{font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
select{width:100%;min-height:48px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 16px var(--body)}
.selo{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;white-space:nowrap}
.vista{display:grid;gap:14px}
.vista[hidden]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:10px;min-width:0}
h1{font-size:24px;margin:0;line-height:1.2;text-wrap:balance}
h2{font-size:20px;margin:0;line-height:1.25}
h3{font-size:15px;margin:0}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
p{margin:0}
.mute{color:var(--mute)}
.fala{background:var(--gold-bg);border-radius:12px;padding:10px 12px;font-size:15.5px}
.fala mark{background:none;color:var(--gold);font-weight:800}
.nota{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14.5px}
.ok{background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14.5px}
ul,ol{margin:0;padding-left:20px;display:grid;gap:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:0}
.kv dt{color:var(--mute)} .kv dd{margin:0;font-weight:700;min-width:0;overflow-wrap:anywhere}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 15px var(--body);text-decoration:none;cursor:pointer}
.btn.forte{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible,button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.mini{font:700 13px var(--body);padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.check input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--ok)}
.check.feito span{text-decoration:line-through;color:var(--mute)}
.reels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.reel{display:grid;gap:6px;align-content:start}
.reel video{width:100%;aspect-ratio:9/16;border-radius:14px;background:#000;display:block}
.reel b{font-size:14px} .reel span{font-size:12.5px;color:var(--mute)}
.calc label{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.calc label:first-of-type{border-top:0}
.calc input{width:86px;flex:none;padding:9px 10px;border:1px solid var(--line);border-radius:10px;font:700 16px var(--body);text-align:right;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.total{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:18px;text-align:center;display:grid;gap:4px}
.total .v{font-size:52px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.barra{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.barra i{display:block;height:100%;background:var(--gold);transition:width .3s}
.msg{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px}
.estado{font-size:13px;font-weight:700;color:var(--ok)}
details.obj summary,details.tut summary{cursor:pointer;font-weight:800;font-size:16px;list-style:none;display:flex;justify-content:space-between;gap:10px}
details summary::-webkit-details-marker{display:none}
details.obj summary::after,details.tut summary::after{content:"+";color:var(--gold);font-size:20px;line-height:1}
details[open].obj summary::after,details[open].tut summary::after{content:"–"}
details.obj > div,details.tut > ol,details.tut > ul,details.tut > p{margin-top:10px}
details.obj > div{display:grid;gap:8px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs button{display:grid;place-items:center;gap:2px;min-height:58px;color:var(--mute);background:none;border:0;font:700 11px var(--body);cursor:pointer}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] svg{color:var(--gold)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
td,th{padding:8px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
/* Dentro da app de terreno (?embed=1): a lead vem da ficha, por isso esconde o seletor. */
html.embed header.topo{position:static}
html.embed .escolha-lead{display:none}
</style>
<script>if (/[?&]embed=1/.test(location.search)) document.documentElement.classList.add("embed");</script>

let lead = null, vista = "lead";
const VISTAS = ["lead","guiao","mostrar","contas","seguir","fechar"];

function escolher(id, v){
  lead = LEADS.find(x => x.id === id) || LEADS[0];
  if (v && VISTAS.includes(v)) vista = v;
  $("escolha").value = lead.id;
  guardar("montra-ultima", lead.id);
  history.replaceState(null, "", `#${lead.id}${vista !== "lead" ? "/" + vista : ""}`);
  desenhar();
}
function irPara(v){
  vista = v;
  VISTAS.forEach(n => { $("v-"+n).hidden = n !== v; });
  document.querySelectorAll("nav.tabs button").forEach(b => b.dataset.v === v ? b.setAttribute("aria-current","page") : b.removeAttribute("aria-current"));
  document.querySelectorAll("video").forEach(vd => { if (v !== "mostrar") vd.pause(); });
  history.replaceState(null, "", `#${lead.id}${v !== "lead" ? "/" + v : ""}`);
  window.scrollTo(0,0);

      campo("novos", "Clientes novos por mês com vídeos e anúncios", c.novos)),

      campo("vagas", auto ? "Carros a mais por semana que cabiam na oficina" : "Vagas vazias por semana", c.vagas),
      el("p",{className:"mute",style:"font-size:14px",textContent:"Conta-se metade como preenchida com publicações e anúncios nos dias fracos."})),
    el("div",{className:"card calc"}, el("h3",{}, "3 · Tempo deles ", el("span",{id:"r3",style:"float:right;color:var(--ok)"})),
      campo("horas", "Horas por semana com redes e mensagens", c.horas),
      campo("hora", "Quanto ganha por hora a trabalhar (€)", c.hora)),
    el("div",{className:"total"}, el("div",{className:"eyebrow",style:"color:inherit;opacity:.8",textContent:"O que ganham por mês"}),
      el("div",{className:"v",id:"tot"}), el("div",{id:"tots",style:"font-size:14px;opacity:.85"})),
    card(eyebrow("E o preço"), el("p",{}, el("b",{id:"pct",style:"font-size:22px"}), " do que ganham · ", el("b",{textContent:`${PRECO}€/mês`})),
      el("div",{className:"barra"}, el("i",{id:"bar"})), el("p",{className:"ok",id:"fica"}), el("p",{className:"mute",id:"bastam"}))
  );
  document.querySelectorAll(".calc input").forEach(i => i.addEventListener("input", calc));
  calc();
}
function calc(){
  const n = k => parseFloat(($("c-"+k).value||"").replace(",", ".")) || 0, sem = 4.3;
  const novos = n("novos") * n("valor") * n("freq");
  const vagas = n("vagas") * sem * n("valor") / 2;
  const tempo = n("horas") * sem * n("hora");
  const total = novos + vagas + tempo;
  $("r1").textContent = "+"+eur(novos); $("r2").textContent = "+"+eur(vagas); $("r3").textContent = "+"+eur(tempo);
  $("tot").textContent = eur(total);
  $("tots").textContent = `${eur(novos)} clientes novos + ${eur(vagas)} agenda + ${eur(tempo)} tempo`;
  const p = total > 0 ? PRECO/total*100 : 0;
  $("pct").textContent = (p<1 ? "<1" : Math.round(p)) + "%";
  $("bar").style.width = Math.min(100,p) + "%";
  $("fica").textContent = total > PRECO ? `Pagam ${PRECO}€ e ficam com ${eur(total-PRECO)} a mais por mês.` : "Com estes números ainda não compensa. Pergunta pelos dias vazios.";
  const porCliente = n("valor") * n("freq");
  const b = porCliente > 0 ? Math.ceil(PRECO / porCliente) : 0;
  $("bastam").textContent = b ? `Bastam ${b} ${b === 1 ? "cliente novo fiel" : "clientes novos fiéis"} por mês para pagar os ${PRECO}€.` : "";
}

// ---------------------------------------------------------------- arranque
function preencherEscolha(){
  const grupos = {barbeiro:"Barbearias", cabelo:"Cabeleireiros", estetica:"Estética", unhas:"Unhas e beleza", auto:"Oficinas"};
  for (const [r, rot] of Object.entries(grupos)) {
    const og = el("optgroup",{label:rot});
    LEADS.filter(l => l.ramo === r).forEach(l => og.append(el("option",{value:l.id,textContent:l.nome})));
    if (og.children.length) $("escolha").append(og);
  }
  $("escolha").addEventListener("change", e => escolher(e.target.value));
}
function aplicarTema(t){ document.documentElement.setAttribute("data-theme", t); $("tema").textContent = t === "dark" ? "Claro" : "Escuro"; }
let tema = ler("montra-tema", "light"); aplicarTema(tema);
$("tema").addEventListener("click", () => { tema = tema === "dark" ? "light" : "dark"; aplicarTema(tema); guardar("montra-tema", tema); });
$("selo").textContent = `${PRECO}€/mês`;
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => irPara(b.dataset.v)));
preencherEscolha();
function doEndereco(){
  const [hId, hV] = decodeURIComponent(location.hash.slice(1)).split("/");
  if (lead && hId === lead.id) { if (hV !== vista) irPara(VISTAS.includes(hV) ? hV : "lead"); return; }
  escolher(hId || ler("montra-ultima", LEADS[0].id), hV || "lead");
}
window.addEventListener("hashchange", doEndereco);
doEndereco();
